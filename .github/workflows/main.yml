name: 'main'
on:
  push:
    branches:
      - main
        
permissions:
  id-token: write
  contents: write
  issues: write

jobs:
  dep:
    runs-on: ubuntu-latest
    environment: dep
    steps:
      - name: Set Version
        run: |
            echo ${{github.event_name}}
            echo ${{github.ref}}
            echo ${{github.base_ref}}
  dep1:
    runs-on: ubuntu-latest
    needs: [dep]
    environment: dep1
    steps:
      - name: Set Version
        run: |
            echo ${{github.event_name}}
  dep12:
    runs-on: ubuntu-latest
    needs: [dep1]
    environment: dep1
    steps:
      - name: Set Version
        run: |
            echo ${{github.event_name}}
     
  dep2:
    runs-on: ubuntu-latest
    needs: [dep12]
    environment: dep2
    steps:
      - name: Set Version
        run: |
            echo ${{github.event_name}}            
